services:
  postgres:
    image: postgres:16-alpine
    container_name: cargo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cargo_disponibilidade
      POSTGRES_USER: cargo_admin
      POSTGRES_PASSWORD: change_me
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo_admin -d cargo_disponibilidade"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
